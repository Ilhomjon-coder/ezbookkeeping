name: Deploy

# Build a multi-arch Docker image, push to GHCR, then SSH into the droplet and
# pull + restart the docker-compose stack.
#
# Required repository secrets:
#   DROPLET_HOST       — droplet IP or hostname
#   DROPLET_USER       — SSH user (e.g. root or deploy)
#   DROPLET_SSH_KEY    — private SSH key with shell access to the droplet
#
# Required (or override per-environment) repository variables:
#   DROPLET_APP_DIR    — path on droplet that holds docker-compose.yml + .env (default: /opt/ezbookkeeping)
#
# Optional repository variables:
#   DROPLET_SSH_PORT   — defaults to 22
#
# Manual deploys are supported via the "Run workflow" button (workflow_dispatch).

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RELEASE_BUILD=${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
            SKIP_TESTS=

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only auto-deploy on main + tags; skip if SSH secrets aren't configured.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check SSH secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DROPLET_HOST }}" ] || [ -z "${{ secrets.DROPLET_USER }}" ] || [ -z "${{ secrets.DROPLET_SSH_KEY }}" ]; then
            echo "SSH secrets not set — skipping deploy. Image was pushed to GHCR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ vars.DROPLET_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.DROPLET_APP_DIR || '/opt/ezbookkeeping' }}"
            cd "$APP_DIR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
